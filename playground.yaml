kind: playground
name: genai-k8s-workshop
base: k3s
title: "Generative AI in Kubernetes Workshop"
description: |
  A multi-node Kubernetes cluster for the GenAI workshop.
  Includes Helm, cert-manager pre-installed, and Ollama image pre-pulled.
  Run the exercises to deploy LLMs, explore GPU scheduling, KServe, and more.
cover: __static__/genai-k8s-cover.png
categories:
  - kubernetes
  - containers
playground:
  networks:
    - name: local
      subnet: 172.16.0.0/24
  machines:
    - name: dev-machine
      users:
        - name: root
        - name: laborant
          default: true
      drives:
        - source: k3s-dev-machine
          mount: /
          size: 30GiB
      network:
        interfaces:
          - address: 172.16.0.5/24
            network: local
      resources:
        cpuCount: 2
        ramSize: 4GiB
    - name: cplane-01
      users:
        - name: root
        - name: laborant
          default: true
      drives:
        - source: k3s-cplane
          mount: /
          size: 30GiB
      network:
        interfaces:
          - address: 172.16.0.2/24
            network: local
      resources:
        cpuCount: 2
        ramSize: 4GiB
    - name: node-01
      users:
        - name: root
        - name: laborant
          default: true
      drives:
        - source: k3s-node
          mount: /
          size: 30GiB
      network:
        interfaces:
          - address: 172.16.0.3/24
            network: local
      resources:
        cpuCount: 2
        ramSize: 4GiB
    - name: node-02
      users:
        - name: root
        - name: laborant
          default: true
      drives:
        - source: k3s-node
          mount: /
          size: 30GiB
      network:
        interfaces:
          - address: 172.16.0.4/24
            network: local
      resources:
        cpuCount: 2
        ramSize: 4GiB
  tabs:
    - id: terminal
      kind: terminal
      name: Terminal
      machine: dev-machine
    - id: ide
      kind: ide
      name: IDE
      machine: dev-machine
    - id: kexp
      kind: kexp
      name: Explorer
      machine: dev-machine
  initTasks:
    init_setup:
      name: init_setup
      machine: dev-machine
      init: true
      user: root
      run: |
        #!/bin/bash
        set -euo pipefail

        # Wait for cluster
        while ! kubectl get nodes 2>/dev/null | grep -q " Ready"; do sleep 2; done

        # Install Helm
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

        # Install cert-manager (needed by KServe later)
        kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.16.3/cert-manager.yaml
        kubectl wait --for=condition=Available deployment --all -n cert-manager --timeout=120s || true

        # Delete k3s built-in nvidia RuntimeClass (conflicts with fake-gpu-operator)
        kubectl delete runtimeclass nvidia 2>/dev/null || true

        # Pre-pull Ollama image on worker nodes to save time during the workshop
        for node_name in node-01 node-02; do
          kubectl run prepull-${node_name} --image=ollama/ollama:latest --restart=Never \
            --overrides="{\"spec\":{\"nodeName\":\"${node_name}\",\"containers\":[{\"name\":\"prepull\",\"image\":\"ollama/ollama:latest\",\"command\":[\"echo\",\"done\"]}]}}" 2>/dev/null || true
        done

        echo ""
        echo "========================================="
        echo "  GenAI in Kubernetes Workshop"
        echo ""
        echo "  Cluster: $(kubectl get nodes --no-headers | wc -l | tr -d ' ') nodes ready"
        echo "  Helm: $(helm version --short)"
        echo "  cert-manager: installed"
        echo "  Ollama: pre-pulling on worker nodes"
        echo ""
        echo "  Start with Lab 1!"
        echo "========================================="
  accessControl:
    canList:
      - anyone
    canRead:
      - anyone
    canStart:
      - anyone
