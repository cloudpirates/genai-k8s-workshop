apiVersion: v1
kind: Pod
metadata:
  name: gpu-test
spec:
  restartPolicy: Never
  containers:
  - name: gpu-test
    image: busybox:1.36
    command: ["sh", "-c", "echo 'Running on node with GPU allocation' && nvidia-smi 2>/dev/null || echo 'nvidia-smi: emulated GPU (no real driver)' && sleep 30"]
    resources:
      limits:
        nvidia.com/gpu: 1
